[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    unit: Fast unit tests without external DB or I/O
    integration: Integration tests with in-memory SQLite DB or ASGI test client
    security: Static security audit and payload sanitization tests
    e2e: End-to-end multi-stage pipeline tests
    slow: Tests requiring extended processing time
